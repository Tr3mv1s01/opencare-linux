[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opencare-linux"
version = "0.0.1b1"
description = "Free, local Linux maintenance desktop toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenCare contributors"}]
dependencies = []
keywords = ["linux", "system-maintenance", "cleanup", "desktop", "cinnamon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/Tr3mv1s01/opencare-linux"
Issues = "https://github.com/Tr3mv1s01/opencare-linux/issues"

[project.scripts]
opencare = "opencare.__main__:main"

[tool.setuptools.packages.find]
include = ["opencare*"]
